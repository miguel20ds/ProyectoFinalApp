<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button default-href="/login" text="Volver" color="secondary"></ion-back-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="centrado">
    <ion-card class="tarjeta">
      <ion-card-content>
        <h1>Crear cuenta</h1>
        <p class="sub">Regístrate para reservar tus perfumes</p>

        <form [formGroup]="form" (ngSubmit)="registrarse()">
          <ion-input formControlName="nombre" type="text" autocomplete="name"
            fill="outline" label="Nombre" labelPlacement="floating"
            [errorText]="error('nombre')"></ion-input>

          <ion-input formControlName="email" type="email" autocomplete="email"
            fill="outline" label="Correo electrónico" labelPlacement="floating"
            [errorText]="error('email')"></ion-input>

          <ion-input formControlName="password" type="password" autocomplete="new-password"
            fill="outline" label="Contraseña" labelPlacement="floating"
            [errorText]="error('password')">
            <ion-input-password-toggle slot="end" color="secondary"></ion-input-password-toggle>
          </ion-input>

          <ion-input formControlName="confirmar" type="password" autocomplete="new-password"
            fill="outline" label="Confirmar contraseña" labelPlacement="floating"
            [errorText]="error('confirmar')">
            <ion-input-password-toggle slot="end" color="secondary"></ion-input-password-toggle>
          </ion-input>

          <ion-button type="submit" expand="block" shape="round" size="large" [disabled]="cargando()">
            REGISTRARME
          </ion-button>
        </form>
      </ion-card-content>
    </ion-card>
  </div>
</ion-content>
