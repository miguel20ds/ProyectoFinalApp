<ion-content class="ion-padding">
  <div class="hero">
    <div class="emoji">💎</div>
    <h1>Tu Aroma Encantador</h1>
    <p class="subtitulo">El arte del perfume exclusivo</p>
  </div>

  <ion-card class="tarjeta">
    <ion-card-content>
      <h2>¿Por qué elegirnos?</h2>
      <p>✓ Marcas exclusivas VIP<br />✓ 100% Originales garantizados<br />✓ Reserva con atención premium</p>
    </ion-card-content>
  </ion-card>

  <ion-card class="tarjeta">
    <ion-card-content>
      <h2>Visítanos</h2>
      <p>📍 Cra. 32 # 25 Sur 10<br />🕘 L-V: 9am-8pm | S: 10am-7pm<br />📞 +57 322 377 3543</p>
    </ion-card-content>
  </ion-card>

  <ion-card class="tarjeta">
    <ion-card-content>
      <h2>Nuestras redes</h2>
      <button type="button" class="enlace" (click)="abrir('https://www.tiktok.com/es/')">🔗 TikTok</button>
      <button type="button" class="enlace" (click)="abrir('https://www.facebook.com/?locale=es_LA')">🔗 Facebook</button>
      <button type="button" class="enlace" (click)="abrir('https://www.instagram.com/')">🔗 Instagram</button>
    </ion-card-content>
  </ion-card>

  <ion-button expand="block" shape="round" size="large" (click)="ingresar()">
    Ingresar a la tienda
  </ion-button>
</ion-content>
